<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JA↔ID">
<title>JA↔ID Translator</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0f0d;--surface:#111815;--card:#162019;--border:#1e2e24;
    --ja:#4ade80;--id:#34d399;--accent:#10b981;--text:#e2f5eb;--muted:#6b8f7a;
    --bja:#0f2e1a;--bid:#0a2420;
  }
  html,body{height:100%;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;flex-direction:column;height:100dvh}

  /* Setup */
  #setup{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:32px 24px;z-index:100}
  #setup.hidden{display:none}
  .setup-icon{font-size:52px;margin-bottom:20px}
  .setup-title{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;
    color:#bbf7d0;margin-bottom:6px;text-align:center}
  .setup-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:32px;line-height:1.8}
  .setup-label{font-size:12px;color:var(--muted);align-self:flex-start;margin-bottom:6px;width:100%}
  .setup-input{width:100%;padding:14px 16px;background:var(--card);border:1.5px solid var(--border);
    border-radius:12px;color:var(--text);font-size:14px;outline:none;margin-bottom:16px}
  .setup-input:focus{border-color:var(--accent)}
  .setup-btn{width:100%;padding:16px;background:var(--accent);border-radius:12px;
    color:#fff;font-size:16px;font-weight:700;transition:opacity .2s}
  .setup-btn:active{opacity:.8}
  .setup-hint{margin-top:16px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
  .setup-hint a{color:var(--accent)}

  /* App */
  #app{display:flex;flex-direction:column;height:100%}
  #app.hidden{display:none}

  .hdr{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;flex-shrink:0}
  .hdr-ico{width:32px;height:32px;border-radius:8px;
    background:linear-gradient(135deg,var(--ja),var(--id));
    display:flex;align-items:center;justify-content:center;font-size:16px}
  .hdr-title{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:#bbf7d0}
  .hdr-sub{font-size:10px;color:var(--muted);margin-top:1px}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .auto-tts-btn{font-size:11px;padding:4px 9px;border-radius:6px;cursor:pointer;
    border:1px solid var(--border);background:transparent;color:var(--muted);
    font-family:'Noto Sans JP',sans-serif;transition:all .2s;white-space:nowrap}
  .auto-tts-btn.on{border-color:var(--accent);background:#0e2e20;color:var(--accent)}
  .settings-btn{background:none;border:none;font-size:18px;opacity:.5;cursor:pointer;padding:2px}
  .clear-btn{font-size:11px;color:var(--muted);background:none;
    border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer}

  .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    flex:1;color:var(--muted);text-align:center;gap:10px}
  .empty-ico{font-size:40px}
  .empty-txt{font-size:14px;line-height:2.2}

  .pair{display:flex;flex-direction:column;animation:fadeUp .3s ease}
  .pair.ja{align-items:flex-start}
  .pair.id{align-items:flex-end}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .bubble{max-width:88%;padding:10px 13px}
  .bja{background:var(--bja);border:1px solid #1a4a2a;border-radius:4px 14px 14px 14px}
  .bid{background:var(--bid);border:1px solid #0e3a30;border-radius:14px 4px 14px 14px}
  .b-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .b-lang{font-family:'Space Mono',monospace;font-size:9px}
  .b-text{font-size:15px;line-height:1.65}
  .arrow{font-size:11px;color:var(--muted);margin:4px 12px}

  .tts-btn{background:none;border:1px solid transparent;cursor:pointer;
    padding:3px 7px;border-radius:6px;font-size:14px;line-height:1;
    color:var(--muted);transition:all .2s}
  .tts-btn:active{border-color:var(--accent);color:var(--accent);background:#0e2e20}
  .tts-btn.speaking{border-color:var(--accent);color:var(--accent);background:#0e2e20;
    animation:pulse-tts .7s infinite}
  @keyframes pulse-tts{0%,100%{opacity:1}50%{opacity:.4}}

  .dots{display:inline-flex;gap:4px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dp 1s infinite}
  .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
  @keyframes dp{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}

  .ctrl{background:var(--surface);border-top:1px solid var(--border);
    padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));flex-shrink:0}
  .spk-row{display:flex;gap:8px;margin-bottom:10px}
  .spk{flex:1;padding:11px 0;border-radius:10px;border:1.5px solid var(--border);
    background:transparent;color:var(--muted);font-size:13px;cursor:pointer;
    font-family:'Noto Sans JP',sans-serif;transition:all .2s}
  .spk.aJa{border-color:var(--ja);background:#0d2a1a;color:var(--ja);font-weight:700}
  .spk.aId{border-color:var(--id);background:#08221e;color:var(--id);font-weight:700}
  .swap{width:42px;flex-shrink:0;background:var(--card);border-radius:10px;
    border:1px solid var(--border);font-size:16px;color:var(--accent);
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .inp-row{display:flex;gap:8px}
  .inp{flex:1;padding:13px 14px;background:var(--card);border:1px solid var(--border);
    border-radius:10px;color:var(--text);font-size:15px;outline:none;
    font-family:'Noto Sans JP',sans-serif}
  .inp:focus{border-color:var(--accent)}
  .send{padding:13px 18px;border-radius:10px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;border:none;cursor:pointer}
  .send:disabled{background:var(--border);opacity:.6}
  .hints{display:flex;justify-content:space-between;margin-top:7px;min-height:16px}
  .auto-hint{font-size:11px;color:var(--muted);display:none}
  .err{color:#f87171;font-size:11px;display:none}
</style>
</head>
<body>

<!-- no setup needed -->

<div id="app">
  <div class="hdr">
    <div class="hdr-ico">🌏</div>
    <div>
      <div class="hdr-title">JA ↔ ID Translator</div>
      <div class="hdr-sub">無料・APIキー不要 / Gratis tanpa API key</div>
    </div>
    <div class="hdr-right">
      <button class="auto-tts-btn" id="autoTtsBtn" onclick="toggleAutoTts()">🔊 自動読上</button>
      
      <button class="clear-btn" onclick="clearAll()">クリア</button>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div class="empty" id="empty">
      <div class="empty-ico">🌏</div>
      <div class="empty-txt">テキストを入力して翻訳<br>
        <span style="font-size:12px;color:#4b6b58">Ketik teks untuk menerjemahkan</span><br>
        <span style="font-size:11px;color:#3a5a46">🔊 翻訳後に読み上げボタンが出ます</span>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <div class="spk-row">
      <button class="spk aJa" id="bJa" onclick="setSide('ja')">🇯🇵 日本語</button>
      <button class="spk" id="bId" onclick="setSide('id')">🇮🇩 Indonesia</button>
      <button class="swap" onclick="swapSide()">⇄</button>
    </div>
    <div class="inp-row">
      <input class="inp" id="inp"
        placeholder="日本語を入力 / 🎤キーボードマイクもOK"
        enterkeyhint="send"
        onkeydown="if(event.key==='Enter'){clearTimeout(window._dt);send();}"
        oninput="onInp()">
      <button class="send" id="sendBtn" onclick="send()">→</button>
    </div>
    <div class="hints">
      <div class="auto-hint" id="autoHint">⏳ 1秒後に自動翻訳...</div>
      <div class="err" id="err"></div>
    </div>
  </div>
</div>

<script>
let side = 'ja';
let busy = false;
let autoTts = false;
let activeTtsBtn = null;

const langLabel = {ja:'🇯🇵 日本語', id:'🇮🇩 Indonesia'};
const langColor  = {ja:'#4ade80',   id:'#34d399'};
const langBCP    = {ja:'ja-JP',     id:'id-ID'};
const mmLang     = {ja:'JA',        id:'ID'};

function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
}

function setSide(s) {
  side = s;
  document.getElementById('bJa').className = 'spk' + (s==='ja' ? ' aJa' : '');
  document.getElementById('bId').className = 'spk' + (s==='id' ? ' aId' : '');
  document.getElementById('inp').placeholder =
    s==='ja' ? '日本語を入力 / 🎤キーボードマイクもOK'
             : 'Ketik Indonesia / 🎤 Mikrofon keyboard OK';
}
function swapSide() { setSide(side==='ja'?'id':'ja'); }

function toggleAutoTts() {
  autoTts = !autoTts;
  const btn = document.getElementById('autoTtsBtn');
  btn.className = 'auto-tts-btn' + (autoTts ? ' on' : '');
  btn.textContent = autoTts ? '🔊 自動ON' : '🔊 自動読上';
}

function speak(text, lang, btnEl) {
  if (!window.speechSynthesis) { alert('TTS未対応ブラウザです'); return; }
  window.speechSynthesis.cancel();
  if (activeTtsBtn === btnEl) { activeTtsBtn = null; return; }
  if (activeTtsBtn) activeTtsBtn.classList.remove('speaking');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = langBCP[lang];
  utter.rate = 0.92;
  const voices = window.speechSynthesis.getVoices();
  const prefix = langBCP[lang].split('-')[0];
  const match = voices.find(v => v.lang === langBCP[lang]) || voices.find(v => v.lang.startsWith(prefix));
  if (match) utter.voice = match;
  if (btnEl) {
    btnEl.classList.add('speaking');
    activeTtsBtn = btnEl;
    const done = () => { btnEl.classList.remove('speaking'); if (activeTtsBtn===btnEl) activeTtsBtn=null; };
    utter.onend = done; utter.onerror = done;
  }
  window.speechSynthesis.speak(utter);
}

function onInp() {
  clearTimeout(window._dt);
  const val = document.getElementById('inp').value.trim();
  const hint = document.getElementById('autoHint');
  if (!val) { hint.style.display='none'; return; }
  hint.style.display='';
  window._dt = setTimeout(() => { hint.style.display='none'; send(); }, 1200);
}

async function send() {
  clearTimeout(window._dt);
  document.getElementById('autoHint').style.display='none';
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text || busy) return;
  inp.value = '';
  busy = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('err').style.display = 'none';

  const toLang = side==='ja' ? 'id' : 'ja';
  const id = Date.now();
  addPair(id, side, text, toLang);

  try {
    const langpair = mmLang[side] + '|' + mmLang[toLang];
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + langpair;
    const res = await fetch(url);
    const data = await res.json();
    if (data.responseStatus !== 200) throw new Error('Status: ' + data.responseStatus + ' ' + (data.responseDetails || ''));
    const translated = data.responseData?.translatedText || '';
    if (!translated) throw new Error('翻訳結果が空です');
    updatePair(id, toLang, translated);
    if (autoTts && translated) {
      setTimeout(() => { const btn = document.getElementById('tts-'+id); speak(translated, toLang, btn); }, 300);
    }
  } catch(e) {
    updatePair(id, toLang, '翻訳エラー / Error terjemahan');
    document.getElementById('err').textContent = '⚠️ ' + (e.message || '翻訳失敗');
    document.getElementById('err').style.display = '';
  }
  busy = false;
  document.getElementById('sendBtn').disabled = false;
}

function addPair(id, from, original, to) {
  document.getElementById('empty').style.display = 'none';
  const msgs = document.getElementById('msgs');
  const pair = document.createElement('div');
  pair.className = 'pair ' + from;
  pair.innerHTML = \`
    <div class="bubble b\${from}">
      <div class="b-header">
        <span class="b-lang" style="color:\${langColor[from]}">\${langLabel[from]}</span>
      </div>
      <div class="b-text">\${esc(original)}</div>
    </div>
    <div class="arrow">\${from==='ja'?'↓ Indonesia':'↓ 日本語'}</div>
    <div class="bubble b\${to}">
      <div class="b-header">
        <span class="b-lang" style="color:\${langColor[to]}">\${langLabel[to]}</span>
        <button class="tts-btn" id="tts-\${id}" style="display:none"
          data-lang="\${to}" data-text=""
          onclick="speak(this.dataset.text,this.dataset.lang,this)">🔊</button>
      </div>
      <div class="b-text" id="t\${id}">
        <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </div>
    </div>\`;
  msgs.appendChild(pair);
  msgs.scrollTop = msgs.scrollHeight;
}

function updatePair(id, toLang, text) {
  const el = document.getElementById('t'+id);
  if (el) el.textContent = text;
  const btn = document.getElementById('tts-'+id);
  if (btn && text && !text.includes('エラー')) { btn.dataset.text=text; btn.style.display=''; }
  document.getElementById('msgs').scrollTop = 99999;
}

function clearAll() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  activeTtsBtn = null;
  document.getElementById('msgs').innerHTML =
    \`<div class="empty" id="empty"><div class="empty-ico">🌏</div>
    <div class="empty-txt">テキストを入力して翻訳<br>
      <span style="font-size:12px;color:#4b6b58">Ketik teks untuk menerjemahkan</span><br>
      <span style="font-size:11px;color:#3a5a46">🔊 翻訳後に読み上げボタンが出ます</span>
    </div></div>\`;
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
</body>
</html>
